<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ViveBlox World — Player</title><style>html,body,#game{margin:0;width:100%;height:100%;overflow:hidden;background:#9ed8ff;font-family:Arial;color:#fff}#game{touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.pill{background:#111b;color:#fff;padding:9px 12px;border-radius:10px;font-weight:800}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;text-shadow:0 1px 3px #000}.hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#111b;padding:9px 13px;border-radius:10px;font-size:12px}.joy{position:absolute;bottom:25px;left:25px;width:115px;height:115px;border-radius:50%;background:#0003;border:2px solid #fff5;pointer-events:auto}.stick{position:absolute;width:52px;height:52px;left:30px;top:30px;border-radius:50%;background:#fff8}.jump{position:absolute;right:25px;bottom:35px;width:75px;height:75px;border:0;border-radius:50%;background:#111d;color:#fff;font-weight:900;font-size:14px;pointer-events:auto}@media(min-width:801px){.joy,.jump{display:none}}</style></head><body><div id="game"></div><div class="hud"><div class="top"><div class="pill">ViveBlox World</div><div class="pill">1 jugador · Alpha</div></div><div class="cross">+</div><div class="hint">WASD / flechas para moverte · Espacio para saltar · Arrastra para mirar</div><div id="joy" class="joy"><div id="stick" class="stick"></div></div><button id="jump" class="jump">SALTAR</button></div><script type="module" src="game.js"></script></body></html>
