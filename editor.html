<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ViveBlox Studio — Alpha 1.5</title><link rel="stylesheet" href="src/style.css"></head><body class="studio"><header class="topbar"><div class="brand">Vive<span>Blox</span> Studio</div><button class="see" onclick="location.href='index.html'">← Volver</button><button class="play" id="save">💾 Guardar mapa</button></header><main class="editor"><aside><h2>🧱 Bloques</h2><button class="tool" data-type="grass">🌿 Césped</button><button class="tool" data-type="stone">⬜ Piedra</button><button class="tool" data-type="wood">🟫 Madera</button><button class="tool" data-type="water">🟦 Agua</button><button class="tool" data-type="erase">🗑️ Borrar</button><p>Selecciona un bloque y toca/clickea el tablero para colocarlo.</p></aside><section><h1>Mi mapa</h1><div id="grid" class="grid"></div></section></main><script>const grid=document.querySelector('#grid');let selected='grass';const key='viveblox-map';let map=JSON.parse(localStorage.getItem(key)||'[]');for(let i=0;i<144;i++){const c=document.createElement('button');c.className='cell';c.onclick=()=>{map[i]=selected;c.className='cell '+selected};grid.appendChild(c)}map.forEach((v,i)=>{if(v){grid.children[i].className='cell '+v}});document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>selected=b.dataset.type);document.querySelector('#save').onclick=()=>{localStorage.setItem(key,JSON.stringify(map));alert('Mapa guardado en este dispositivo.')}</script></body></html>
